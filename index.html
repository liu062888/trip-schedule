<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>九州11天 劉宇軒 & 謝詠恩</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap');

  :root {
    --bg: #f7f5f0;
    --card: #ffffff;
    --border: #e8e4dc;
    --text: #1a1a18;
    --muted: #7a7870;
    --accent: #2d6a4f;
    --accent-light: #e8f4ef;
    --accent-mid: #52b788;
    --warn: #b5451b;
    --warn-light: #fdf0eb;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    font-family: 'Noto Sans TC', sans-serif;
    color: var(--text);
    min-height: 100vh;
  }

  /* HERO */
  .hero {
    background: linear-gradient(135deg, #1a3a2a 0%, #2d6a4f 60%, #52b788 100%);
    color: white;
    padding: 48px 24px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '⛰️🌋🏯♨️';
    position: absolute;
    font-size: 120px;
    opacity: 0.06;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    white-space: nowrap;
    letter-spacing: 20px;
  }
  .hero-label { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; opacity: 0.7; margin-bottom: 10px; }
  .hero-title { font-family: 'Noto Serif TC', serif; font-size: clamp(26px, 6vw, 42px); font-weight: 700; line-height: 1.2; margin-bottom: 8px; }
  .hero-names { font-size: 14px; opacity: 0.85; margin-bottom: 20px; }
  .hero-pills { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .hero-pill { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.25); border-radius: 20px; padding: 4px 12px; font-size: 12px; }
  .hero-edit-btn {
    position: absolute; top: 14px; right: 14px;
    background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.35);
    color: white; border-radius: 8px; padding: 5px 10px; font-size: 12px;
    cursor: pointer; font-family: inherit; transition: background 0.15s;
  }
  .hero-edit-btn:hover { background: rgba(255,255,255,0.3); }

  /* NOTICE BAR */
  .notice-bar { background: var(--warn-light); border-bottom: 2px solid #e8c4b4; padding: 10px 20px; font-size: 13px; color: var(--warn); text-align: center; }
  .notice-bar strong { font-weight: 700; }

  /* LAYOUT */
  .container { max-width: 800px; margin: 0 auto; padding: 24px 16px 60px; }

  /* SECTION HEADER */
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; margin-top: 32px; }
  .section-title { font-family: 'Noto Serif TC', serif; font-size: 18px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }
  .edit-all-btn { font-size: 12px; padding: 5px 12px; border-radius: 6px; border: 1px solid var(--accent); background: white; color: var(--accent); cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .edit-all-btn:hover { background: var(--accent-light); }

  /* SUMMARY CARDS */
  .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 8px; }
  .summary-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; text-align: center; }
  .summary-card .val { font-size: 22px; font-weight: 700; color: var(--accent); line-height: 1; }
  .summary-card .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* FLIGHT SECTION */
  .flight-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 500px) { .flight-grid { grid-template-columns: 1fr; } }
  .flight-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px;
    position: relative;
  }
  .flight-card-label { font-size: 10px; letter-spacing: 2px; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  .flight-num { font-size: 22px; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
  .flight-route { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .flight-arrow { color: var(--muted); font-size: 12px; }
  .flight-times { font-size: 12px; color: var(--muted); }
  .flight-date { font-size: 12px; color: var(--accent); font-weight: 500; margin-bottom: 2px; }
  .flight-notes { font-size: 11px; color: var(--muted); margin-top: 6px; font-style: italic; }
  .card-edit-btn { position: absolute; top: 10px; right: 10px; background: none; border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 11px; color: var(--muted); cursor: pointer; font-family: inherit; }
  .card-edit-btn:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }

  /* HOTEL SECTION */
  .hotel-list { display: flex; flex-direction: column; gap: 8px; }
  .hotel-item {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px;
    position: relative;
  }
  .hotel-icon { font-size: 20px; flex-shrink: 0; margin-top: 2px; }
  .hotel-info { flex: 1; min-width: 0; }
  .hotel-dates { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .hotel-name { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .hotel-addr { font-size: 12px; color: var(--muted); }
  .hotel-ref { font-size: 11px; color: var(--accent); margin-top: 4px; }
  .hotel-notes-text { font-size: 11px; color: var(--muted); font-style: italic; margin-top: 3px; }
  .hotel-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .btn-sm { background: none; border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; font-size: 11px; color: var(--muted); cursor: pointer; font-family: inherit; }
  .btn-sm:hover { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
  .btn-sm-del:hover { background: #fdecea; color: #c0392b; border-color: #f5a9a9; }

  /* DAY CARDS */
  .day-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 10px; overflow: hidden; transition: box-shadow 0.2s; }
  .day-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
  .day-header { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; user-select: none; }
  .day-num { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .day-meta { flex: 1; min-width: 0; }
  .day-date { font-size: 12px; color: var(--muted); }
  .day-title-wrap { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .day-name { font-weight: 700; font-size: 15px; }
  .region-tag { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 500; }
  .day-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .day-actions { display: flex; gap: 6px; align-items: center; }
  .btn-edit, .btn-chev { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 16px; padding: 4px; border-radius: 6px; transition: all 0.15s; font-family: inherit; }
  .btn-edit:hover { background: var(--accent-light); color: var(--accent); }
  .btn-chev { transition: transform 0.2s; }
  .btn-chev.open { transform: rotate(180deg); }

  .day-body { display: none; border-top: 1px solid var(--border); }
  .day-body.open { display: block; }

  /* TIMELINE */
  .timeline { padding: 16px 16px 8px 16px; }
  .tl-item { display: grid; grid-template-columns: 64px 1fr; gap: 0 12px; margin-bottom: 12px; position: relative; }
  .tl-item:not(:last-child)::after { content: ''; position: absolute; left: 77px; top: 22px; bottom: -4px; width: 1px; background: var(--border); }
  .tl-time { font-size: 11px; color: var(--muted); padding-top: 3px; text-align: right; }
  .tl-right { display: flex; flex-direction: column; gap: 2px; }
  .tl-dot-wrap { display: flex; align-items: flex-start; gap: 8px; }
  .tl-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .tl-name { font-size: 13px; font-weight: 600; flex: 1; }
  .tl-desc { font-size: 12px; color: var(--muted); line-height: 1.6; padding-left: 16px; }

  /* ALERTS */
  .alerts { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 6px; }
  .alert { padding: 8px 12px; border-radius: 8px; font-size: 12px; line-height: 1.5; display: flex; gap: 6px; }
  .alert-warn { background: var(--warn-light); color: var(--warn); border: 1px solid #f0c4b4; }
  .alert-info { background: var(--accent-light); color: #1a5c3a; border: 1px solid #b8dece; }
  .alert-success { background: #eafaf1; color: #1e6c3e; border: 1px solid #abebc6; }

  /* NOTES */
  .notes-area { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-top: 8px; }
  .notes-area textarea { width: 100%; min-height: 100px; border: 1px solid var(--border); border-radius: 8px; padding: 10px; font-family: inherit; font-size: 13px; color: var(--text); background: var(--bg); resize: vertical; outline: none; }
  .notes-area textarea:focus { border-color: var(--accent-mid); }
  .notes-save-btn { margin-top: 8px; padding: 7px 18px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 13px; font-family: inherit; cursor: pointer; transition: background 0.15s; }
  .notes-save-btn:hover { background: #235c41; }

  /* MODAL */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--card); border-radius: 16px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; padding: 24px; }
  .modal-title { font-family: 'Noto Serif TC', serif; font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--accent); }
  .field-group { margin-bottom: 14px; }
  .field-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; display: block; }
  .field-input { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-family: inherit; font-size: 14px; color: var(--text); background: var(--bg); outline: none; transition: border-color 0.15s; }
  .field-input:focus { border-color: var(--accent-mid); }
  .spots-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .spot-row { display: grid; grid-template-columns: 60px 1fr 1fr auto; gap: 6px; align-items: center; }
  .spot-row input { border: 1px solid var(--border); border-radius: 6px; padding: 7px 8px; font-family: inherit; font-size: 12px; background: var(--bg); color: var(--text); width: 100%; outline: none; }
  .spot-row input:focus { border-color: var(--accent-mid); }
  .btn-del-spot { background: none; border: none; color: #c0392b; cursor: pointer; font-size: 16px; padding: 4px; border-radius: 4px; }
  .btn-del-spot:hover { background: #fdecea; }
  .btn-add-spot { font-size: 12px; padding: 6px 12px; border-radius: 6px; border: 1px dashed var(--accent-mid); background: var(--accent-light); color: var(--accent); cursor: pointer; font-family: inherit; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }
  .btn-cancel { padding: 9px 18px; border-radius: 8px; border: 1px solid var(--border); background: white; color: var(--muted); cursor: pointer; font-family: inherit; font-size: 13px; }
  .btn-save { padding: 9px 20px; border-radius: 8px; border: none; background: var(--accent); color: white; cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500; }
  .btn-save:hover { background: #235c41; }

  /* CHECKLIST */
  .checklist-wrap { display: flex; flex-direction: column; gap: 6px; }
  .check-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--bg); border-radius: 8px; user-select: none; transition: background 0.15s; }
  .check-item:hover { background: var(--accent-light); }
  .check-item input[type=checkbox] { margin-top: 2px; accent-color: var(--accent); width: 15px; height: 15px; flex-shrink: 0; cursor: pointer; }
  .check-item.done .check-label { text-decoration: line-through; color: var(--muted); }
  .check-label { font-size: 13px; line-height: 1.5; flex: 1; cursor: pointer; }
  .check-urgency { font-size: 10px; padding: 1px 6px; border-radius: 10px; white-space: nowrap; flex-shrink: 0; }
  .urg-now { background: #fdecea; color: #c0392b; }
  .urg-soon { background: #fef9e7; color: #9a7d0a; }
  .urg-later { background: var(--accent-light); color: var(--accent); }
  .check-del-btn { background: none; border: none; color: #c0392b; cursor: pointer; font-size: 14px; padding: 2px 4px; border-radius: 4px; flex-shrink: 0; opacity: 0.5; }
  .check-del-btn:hover { opacity: 1; background: #fdecea; }
  .check-edit-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 2px 4px; border-radius: 4px; flex-shrink: 0; opacity: 0.5; }
  .check-edit-btn:hover { opacity: 1; background: var(--accent-light); color: var(--accent); }

  /* CHECK EDIT ROW */
  .check-edit-row { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: white; border: 1px solid var(--accent-mid); border-radius: 8px; }
  .check-edit-row input[type=text] { flex: 1; border: none; outline: none; font-family: inherit; font-size: 13px; background: transparent; }
  .check-edit-row select { border: 1px solid var(--border); border-radius: 6px; padding: 3px 6px; font-size: 11px; font-family: inherit; background: var(--bg); outline: none; }
  .check-edit-row .btn-ck-save { background: var(--accent); color: white; border: none; border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }

  /* HOTEL MODAL ROWS */
  .hotel-row { display: flex; flex-direction: column; gap: 6px; padding: 12px; background: var(--bg); border-radius: 8px; margin-bottom: 8px; position: relative; }
  .hotel-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .hotel-row input { border: 1px solid var(--border); border-radius: 6px; padding: 7px 10px; font-family: inherit; font-size: 13px; background: white; color: var(--text); width: 100%; outline: none; }
  .hotel-row input:focus { border-color: var(--accent-mid); }
  .hotel-row-del { position: absolute; top: 8px; right: 8px; background: none; border: none; color: #c0392b; cursor: pointer; font-size: 15px; padding: 2px; }
  .hotel-row-del:hover { background: #fdecea; border-radius: 4px; }

  /* TOAST */
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text); color: white; padding: 10px 20px; border-radius: 20px; font-size: 13px; transition: transform 0.3s; z-index: 2000; white-space: nowrap; }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* DIVIDER */
  .field-divider { border: none; border-top: 1px solid var(--border); margin: 12px 0; }

  @media (max-width: 500px) {
    .spot-row { grid-template-columns: 50px 1fr auto; }
    .spot-row input:nth-child(3) { display: none; }
    .hero { padding: 36px 16px 28px; }
    .hotel-row-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <button class="hero-edit-btn" onclick="openHeroModal()">✏️ 編輯標題</button>
  <div class="hero-label" id="hero-label">2026 · 九州自駕之旅</div>
  <div class="hero-title" id="hero-title">九州 11 天行程</div>
  <div class="hero-names" id="hero-names">劉宇軒 & 謝詠恩 ✈ 7/7 – 7/17</div>
  <div class="hero-pills" id="hero-pills">
    <span class="hero-pill">🏯 熊本城</span>
    <span class="hero-pill">🌋 阿蘇火山</span>
    <span class="hero-pill">🚣 高千穗峽</span>
    <span class="hero-pill">♨️ 別府</span>
    <span class="hero-pill">🦁 九州自然動物園</span>
  </div>
</div>

<div class="notice-bar">
  ⚠️ <strong>高千穗峽划船（7/9）— 現在馬上預約！</strong> 預約開放日：6/25早上8:00（台灣時間）
</div>

<div class="container">

  <!-- SUMMARY -->
  <div class="summary-grid">
    <div class="summary-card"><div class="val">11</div><div class="lbl">天數</div></div>
    <div class="summary-card"><div class="val">6</div><div class="lbl">自駕天數</div></div>
    <div class="summary-card"><div class="val">5</div><div class="lbl">地區</div></div>
    <div class="summary-card"><div class="val">IT720</div><div class="lbl">去程航班</div></div>
  </div>

  <!-- FLIGHTS -->
  <div class="section-header">
    <div class="section-title">✈️ 航班資訊</div>
  </div>
  <div class="flight-grid" id="flight-grid"></div>

  <!-- HOTELS -->
  <div class="section-header">
    <div class="section-title">🏨 住宿資訊</div>
    <button class="edit-all-btn" onclick="openHotelModal()">＋ 管理住宿</button>
  </div>
  <div class="hotel-list" id="hotel-list"></div>

  <!-- CHECKLIST -->
  <div class="section-header" style="margin-top:28px">
    <div class="section-title">📋 預約清單</div>
    <button class="edit-all-btn" onclick="addCheckItem()">＋ 新增項目</button>
  </div>
  <div class="notes-area">
    <div class="checklist-wrap" id="checklist"></div>
  </div>

  <!-- ITINERARY -->
  <div class="section-header" style="margin-top:28px">
    <div class="section-title">🗓 每日行程</div>
  </div>
  <div id="days-container"></div>

  <!-- NOTES -->
  <div class="section-header">
    <div class="section-title">📝 共享備忘錄</div>
  </div>
  <div class="notes-area">
    <textarea id="shared-notes" placeholder="可以在這裡記下討論的事情、女友的想法..."></textarea>
    <button class="notes-save-btn" onclick="saveNotes()">儲存備忘錄</button>
  </div>

</div>

<!-- HERO EDIT MODAL -->
<div class="modal-overlay" id="hero-modal">
  <div class="modal">
    <div class="modal-title">✏️ 編輯標題</div>
    <div class="field-group">
      <label class="field-label">副標籤（小字）</label>
      <input class="field-input" id="h-label" type="text" placeholder="2026 · 九州自駕之旅">
    </div>
    <div class="field-group">
      <label class="field-label">主標題</label>
      <input class="field-input" id="h-title" type="text" placeholder="九州 11 天行程">
    </div>
    <div class="field-group">
      <label class="field-label">名字與日期</label>
      <input class="field-input" id="h-names" type="text" placeholder="劉宇軒 & 謝詠恩 ✈ 7/7 – 7/17">
    </div>
    <div class="field-group">
      <label class="field-label">標籤 Pills（每行一個，可加 emoji）</label>
      <textarea class="field-input" id="h-pills" rows="5" style="resize:vertical"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal('hero-modal')">取消</button>
      <button class="btn-save" onclick="saveHero()">儲存</button>
    </div>
  </div>
</div>

<!-- FLIGHT EDIT MODAL -->
<div class="modal-overlay" id="flight-modal">
  <div class="modal">
    <div class="modal-title" id="flight-modal-title">✏️ 編輯航班</div>
    <div class="field-group">
      <label class="field-label">航班號碼</label>
      <input class="field-input" id="f-num" type="text" placeholder="IT720">
    </div>
    <div class="field-group">
      <label class="field-label">日期</label>
      <input class="field-input" id="f-date" type="text" placeholder="7/7 (二)">
    </div>
    <div class="field-group">
      <label class="field-label">出發（機場 + 時間）</label>
      <input class="field-input" id="f-dep" type="text" placeholder="TPE 14:30">
    </div>
    <div class="field-group">
      <label class="field-label">抵達（機場 + 時間）</label>
      <input class="field-input" id="f-arr" type="text" placeholder="FUK 16:55">
    </div>
    <div class="field-group">
      <label class="field-label">備註</label>
      <input class="field-input" id="f-notes" type="text" placeholder="線上報到、座位...">
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal('flight-modal')">取消</button>
      <button class="btn-save" onclick="saveFlight()">儲存</button>
    </div>
  </div>
</div>

<!-- HOTEL MODAL -->
<div class="modal-overlay" id="hotel-modal">
  <div class="modal">
    <div class="modal-title">🏨 管理住宿</div>
    <div id="hotel-rows"></div>
    <button class="btn-add-spot" onclick="addHotelRow()" style="margin-bottom:4px">＋ 新增住宿</button>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal('hotel-modal')">取消</button>
      <button class="btn-save" onclick="saveHotels()">儲存</button>
    </div>
  </div>
</div>

<!-- DAY EDIT MODAL -->
<div class="modal-overlay" id="day-modal">
  <div class="modal">

async function loadData() {
  try { const r = await storage.get(STORAGE_KEY); days = r ? JSON.parse(r.value) : JSON.parse(JSON.stringify(DEFAULT_DAYS)); } catch { days = JSON.parse(JSON.stringify(DEFAULT_DAYS)); }
  try { const r = await storage.get(CHECK_KEY);   checks = r ? JSON.parse(r.value) : JSON.parse(JSON.stringify(DEFAULT_CHECKS)); } catch { checks = JSON.parse(JSON.stringify(DEFAULT_CHECKS)); }
  try { const r = await storage.get(HOTEL_KEY);   hotels = r ? JSON.parse(r.value) : JSON.parse(JSON.stringify(DEFAULT_HOTELS)); } catch { hotels = JSON.parse(JSON.stringify(DEFAULT_HOTELS)); }

  try { const r = await storage.get(HERO_KEY);    if (r) hero = JSON.parse(r.value); } catch {}
  try { const r = await storage.get(NOTES_KEY);   if (r) document.getElementById('shared-notes').value = r.value; } catch {}
  renderHero(); renderFlights(); renderHotels(); renderChecks(); render();
}

}

function renderHero() {

  document.getElementById('hero-names').textContent = hero.names;
  document.getElementById('hero-pills').innerHTML = (hero.pills||[]).map(p => `<span class="hero-pill">${p}</span>`).join('');

}

function openHeroModal() {
  document.getElementById('h-label').value = hero.label;
  document.getElementById('h-title').value = hero.title;
  document.getElementById('h-names').value = hero.names;
  document.getElementById('h-pills').value = (hero.pills||[]).join('\n');
  openModal('hero-modal');
}

async function saveHero() {
  hero.label = document.getElementById('h-label').value;
  hero.title = document.getElementById('h-title').value;
  hero.names = document.getElementById('h-names').value;
  hero.pills = document.getElementById('h-pills').value.split('\n').map(s=>s.trim()).filter(Boolean);
  await storage.set(HERO_KEY, JSON.stringify(hero));
  renderHero();
  closeModal('hero-modal');
  showToast('標題已儲存 ✓');
}

// ── FLIGHTS ───────────────────────────────────────────────────────────────────
function renderFlights() {
  const g = document.getElementById('flight-grid');
  g.innerHTML = '';
  [['outbound','去程'], ['return','回程']].forEach(([key, label]) => {
    const f = flights[key];
    const [depCode, depTime] = (f.dep||'').split(' ');
    const [arrCode, arrTime] = (f.arr||'').split(' ');
    const card = document.createElement('div');
    card.className = 'flight-card';
    card.innerHTML = `
      <button class="card-edit-btn" onclick="openFlightModal('${key}')">✏️ 編輯</button>
      <div class="flight-card-label">${label}</div>
      <div class="flight-num">${f.num||'—'}</div>
      <div class="flight-date">${f.date||''}</div>
      <div class="flight-route">
        <span>${depCode||'—'}</span>
        <span class="flight-arrow">──✈──</span>
        <span>${arrCode||'—'}</span>
      </div>
      <div class="flight-times">${depTime||''} 出發 · ${arrTime||''} 抵達</div>
      ${f.notes ? `<div class="flight-notes">${f.notes}</div>` : ''}
    `;
    g.appendChild(card);
  });
}

function openFlightModal(key) {
  editingFlight = key;
  const f = flights[key];
  document.getElementById('flight-modal-title').textContent = key === 'outbound' ? '✏️ 編輯去程航班' : '✏️ 編輯回程航班';
  document.getElementById('f-num').value   = f.num   || '';
  document.getElementById('f-date').value  = f.date  || '';
  document.getElementById('f-dep').value   = f.dep   || '';
  document.getElementById('f-arr').value   = f.arr   || '';
  document.getElementById('f-notes').value = f.notes || '';
  openModal('flight-modal');
}

async function saveFlight() {
  flights[editingFlight] = {
    num:   document.getElementById('f-num').value,
    date:  document.getElementById('f-date').value,
    dep:   document.getElementById('f-dep').value,
    arr:   document.getElementById('f-arr').value,
    notes: document.getElementById('f-notes').value,
  };
  await storage.set(FLIGHT_KEY, JSON.stringify(flights));
  renderFlights();
  closeModal('flight-modal');
  showToast('航班已儲存 ✓');
}

  }
  hotels.forEach((h, i) => {
    const el = document.createElement('div');
    el.className = 'hotel-item';
    el.innerHTML = `
      <div class="hotel-icon">🏨</div>
      <div class="hotel-info">
        <div class="hotel-dates">${h.dates||''}</div>
        <div class="hotel-name">${h.name||'（未命名）'}</div>
        ${h.addr ? `<div class="hotel-addr">📍 ${h.addr}</div>` : ''}
        ${h.ref  ? `<div class="hotel-ref">📋 訂單：${h.ref}</div>` : ''}
        ${h.notes? `<div class="hotel-notes-text">${h.notes}</div>` : ''}
      </div>
      <div class="hotel-actions">
        <button class="btn-sm" onclick="openHotelModalAt(${i})">✏️</button>
      </div>
    `;
    list.appendChild(el);
  });
}

function openHotelModal() {
  editHotels = JSON.parse(JSON.stringify(hotels));
  renderHotelRows();
  openModal('hotel-modal');
}

function openHotelModalAt(i) {
  editHotels = JSON.parse(JSON.stringify(hotels));
  openModal('hotel-modal');
  renderHotelRows();
  document.getElementById('hotel-rows').children[i]?.scrollIntoView({ behavior:'smooth', block:'center' });
}

function renderHotelRows() {
  const c = document.getElementById('hotel-rows');
  c.innerHTML = '';
  editHotels.forEach((h, i) => {
    const el = document.createElement('div');
    el.className = 'hotel-row';
    el.innerHTML = `
      <button class="hotel-row-del" onclick="delHotelRow(${i})">✕</button>
      <div class="hotel-row-grid">
        <input placeholder="入住日期（如 7/7–7/8）" value="${h.dates||''}" oninput="updateHotel(${i},'dates',this.value)">
        <input placeholder="旅館名稱" value="${h.name||''}" oninput="updateHotel(${i},'name',this.value)">
        <input placeholder="地址（可空白）" value="${h.addr||''}" oninput="updateHotel(${i},'addr',this.value)">
        <input placeholder="訂單號碼（可空白）" value="${h.ref||''}" oninput="updateHotel(${i},'ref',this.value)">
      </div>
      <input placeholder="備註（可空白）" value="${h.notes||''}" oninput="updateHotel(${i},'notes',this.value)" style="border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-family:inherit;font-size:13px;background:white;color:var(--text);width:100%;outline:none;">
    `;
    c.appendChild(el);
  });
}

function updateHotel(i, field, val) { if (editHotels[i]) editHotels[i][field] = val; }
function delHotelRow(i) { editHotels.splice(i, 1); renderHotelRows(); }
function addHotelRow() { editHotels.push({ dates:'', name:'', addr:'', ref:'', notes:'' }); renderHotelRows(); }

async function saveHotels() {
  hotels = JSON.parse(JSON.stringify(editHotels));
  await storage.set(HOTEL_KEY, JSON.stringify(hotels));
  renderHotels();
  closeModal('hotel-modal');
  showToast('住宿已儲存 ✓');
}

// ── CHECKLIST ─────────────────────────────────────────────────────────────────
function renderChecks() {
  const c = document.getElementById('checklist');
  c.innerHTML = '';
  checks.forEach((ch, i) => {
    const urgLabel = { now:'🔴 現在就要', soon:'🟡 出發前', later:'🟢 到時再說' }[ch.urgency] || '';
    const urgClass = { now:'urg-now', soon:'urg-soon', later:'urg-later' }[ch.urgency] || 'urg-later';
    const el = document.createElement('div');
    el.className = 'check-item' + (ch.done ? ' done' : '');
    el.id = 'ck-' + i;
    el.innerHTML = `
      <input type="checkbox" ${ch.done ? 'checked' : ''} onchange="toggleCheck(${i}, this.checked)">
      <span class="check-label" onclick="startEditCheck(${i})">${ch.text}</span>
      <span class="check-urgency ${urgClass}">${urgLabel}</span>
      <button class="check-edit-btn" onclick="startEditCheck(${i})" title="編輯">✏️</button>
      <button class="check-del-btn" onclick="deleteCheck(${i})" title="刪除">✕</button>
    `;
    c.appendChild(el);
  });
}

function toggleCheck(i, val) {
  checks[i].done = val;
  document.getElementById('ck-'+i).classList.toggle('done', val);
  storage.set(CHECK_KEY, JSON.stringify(checks));
}

function deleteCheck(i) {
  checks.splice(i, 1);
  storage.set(CHECK_KEY, JSON.stringify(checks));
  renderChecks();
  showToast('已刪除項目');
}

function addCheckItem() {
  checks.push({ id: 'c' + Date.now(), done: false, text: '新項目（點 ✏️ 編輯）', urgency: 'later' });
  storage.set(CHECK_KEY, JSON.stringify(checks));
  renderChecks();
  startEditCheck(checks.length - 1);
}

function startEditCheck(i) {
  const ch = checks[i];
  const el = document.getElementById('ck-' + i);
  el.innerHTML = `
    <div class="check-edit-row" style="flex:1;display:flex;align-items:center;gap:8px;">
      <input type="text" id="ck-text-${i}" value="${ch.text}" style="flex:1;border:none;outline:none;font-family:inherit;font-size:13px;background:transparent;">
      <select id="ck-urg-${i}" style="border:1px solid var(--border);border-radius:6px;padding:3px 6px;font-size:11px;font-family:inherit;background:var(--bg);outline:none;">
        <option value="now"  ${ch.urgency==='now'  ?'selected':''}>🔴 現在就要</option>
        <option value="soon" ${ch.urgency==='soon' ?'selected':''}>🟡 出發前</option>
        <option value="later"${ch.urgency==='later'?'selected':''}>🟢 到時再說</option>
      </select>
      <button class="btn-ck-save" onclick="saveCheckEdit(${i})" style="background:var(--accent);color:white;border:none;border-radius:6px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;">儲存</button>
    </div>
  `;
  el.className = 'check-item';
  document.getElementById('ck-text-' + i).focus();
}

function saveCheckEdit(i) {
  checks[i].text    = document.getElementById('ck-text-' + i).value;
  checks[i].urgency = document.getElementById('ck-urg-'  + i).value;
  storage.set(CHECK_KEY, JSON.stringify(checks));
  renderChecks();
  showToast('已儲存 ✓');
}

// ── DAYS ──────────────────────────────────────────────────────────────────────
function render() {
  const c = document.getElementById('days-container');
  c.innerHTML = '';
  days.forEach((d, i) => {
    const col = COLORS[d.c] || COLORS.ret;
    const el = document.createElement('div');
    el.className = 'day-card';
    el.innerHTML = `
      <div class="day-header" onclick="toggleDay(${i})">
        <div class="day-num" style="background:${col.bg};color:${col.text}">${i+1}</div>
        <div class="day-meta">
          <div class="day-date">${d.date}</div>
          <div class="day-title-wrap">
            <span class="day-name">${d.title}</span>
            <span class="region-tag" style="background:${col.tagBg};color:${col.tagColor}">${col.tag}</span>
          </div>
          <div class="day-sub">${d.sub}</div>
        </div>
        <div class="day-actions">
          <button class="btn-edit" onclick="event.stopPropagation();openDayModal(${i})" title="編輯">✏️</button>
          <button class="btn-chev" id="chev-${i}">▼</button>
        </div>
      </div>
      <div class="day-body" id="body-${i}">
        <div class="timeline">
          ${(d.items||[]).map(it => `
            <div class="tl-item">
              <div class="tl-time">${it.time||''}</div>
              <div class="tl-right">
                <div class="tl-dot-wrap">
                  <div class="tl-dot" style="background:${col.dot}"></div>
                  <div class="tl-name">${it.name||''}</div>
                </div>
                ${it.desc ? `<div class="tl-desc">${it.desc}</div>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
        ${(d.alerts||[]).length ? `
          <div class="alerts">
            ${d.alerts.map(a => `
              <div class="alert alert-${a.type}">
                <span>${a.type==='warn'?'⚠️':a.type==='success'?'✅':'💡'}</span>
                <span>${a.text}</span>
              </div>
            `).join('')}
          </div>
        ` : ''}
      </div>
    `;
    c.appendChild(el);
  });
}

function toggleDay(i) {
  document.getElementById('body-'+i).classList.toggle('open');
  document.getElementById('chev-'+i).classList.toggle('open');
}

function openDayModal(i) {
  editingDay = i;
  const d = days[i];
  editItems = JSON.parse(JSON.stringify(d.items || []));
  document.getElementById('edit-date').value  = d.date  || '';
  document.getElementById('edit-title').value = d.title || '';
  document.getElementById('edit-sub').value   = d.sub   || '';
  renderSpotRows(editItems);
  openModal('day-modal');
}

function renderSpotRows(items) {
  const c = document.getElementById('edit-spots');
  c.innerHTML = '';
  items.forEach((it, i) => {
    const row = document.createElement('div');
    row.className = 'spot-row';
    row.innerHTML = `
      <input placeholder="時間" value="${it.time||''}" oninput="updateSpot(${i},'time',this.value)">
      <input placeholder="名稱" value="${it.name||''}" oninput="updateSpot(${i},'name',this.value)">
      <input placeholder="說明" value="${it.desc||''}" oninput="updateSpot(${i},'desc',this.value)">
      <button class="btn-del-spot" onclick="delSpot(${i})">✕</button>
    `;
    c.appendChild(row);
  });
}

function updateSpot(i, field, val) { if (editItems[i]) editItems[i][field] = val; }
function delSpot(i) { editItems.splice(i, 1); renderSpotRows(editItems); }
function addSpotRow() { editItems.push({time:'', name:'', desc:''}); renderSpotRows(editItems); }

async function saveDay() {
  days[editingDay].date  = document.getElementById('edit-date').value;
  days[editingDay].title = document.getElementById('edit-title').value;
  days[editingDay].sub   = document.getElementById('edit-sub').value;
  days[editingDay].items = JSON.parse(JSON.stringify(editItems));
  await storage.set(STORAGE_KEY, JSON.stringify(days));
  render();
  closeModal('day-modal');
  showToast('行程已儲存 ✓');
}

// ── MODAL HELPERS ─────────────────────────────────────────────────────────────
function openModal(id)  { document.getElementById(id).classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', function(e) { if (e.target === this) this.classList.remove('open'); });
});

// ── TOAST ─────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ── INIT ──────────────────────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
